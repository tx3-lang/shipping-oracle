name: Integration Tests

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/integration.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/integration.yml'
  workflow_dispatch:

jobs:
  integration:
    name: HTTP integration tests + report
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      # Pull-based tests stub Shippo with wiremock — no secrets / network needed.
      # `--all-targets` runs lib + integration + cbor_alignment + signature_vectors
      # + integration_report (which writes backend/reports/integration.{json,md}).
      - name: Run backend tests
        run: cargo test --all-targets -- --nocapture

      - name: Upload integration JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-json
          path: backend/reports/integration.json
          retention-days: 90
          if-no-files-found: warn

      - name: Upload integration Markdown report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-report-md
          path: backend/reports/integration.md
          retention-days: 90
          if-no-files-found: warn

      - name: Append report to job summary
        if: always()
        run: |
          if [ -f reports/integration.md ]; then
            cat reports/integration.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No integration.md report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
